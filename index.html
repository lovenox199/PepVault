<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peptide Vault Pro</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light+Two&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- React & Babel for Browser Rendering -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .brand-font { font-family: 'Shadows Into Light Two', cursive; }
        
        /* Smooth transitions */
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Hide scrollbars */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyBQNYJspqiy4QGDDf1vo2G7p7JL0O3pfxY",
            authDomain: "pepvault-a54fa.firebaseapp.com",
            projectId: "pepvault-a54fa",
            storageBucket: "pepvault-a54fa.firebasestorage.app",
            messagingSenderId: "400542112989",
            appId: "1:400542112989:web:43ac76ba4960530cfd0f34"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Helper Component for Lucide Icons
        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        function App() {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [vials, setVials] = useState([]);
            const [activeTab, setActiveTab] = useState('inventory');
            const [authMode, setAuthMode] = useState('login'); // 'login' | 'signup' | 'forgot'
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [authError, setAuthError] = useState('');
            const [authSuccess, setAuthSuccess] = useState('');
            const [vaultName, setVaultName] = useState('PepVault');
            const [searchTerm, setSearchTerm] = useState('');
            
            // Edit Mode State
            const [editingVialId, setEditingVialId] = useState(null);
            const [editFormData, setEditFormData] = useState({ name: '', mg: '', bac: '', expDate: '' });

            const [formData, setFormData] = useState({ name: '', mg: '', bac: '', expDate: '', targetDose: 250 });

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((u) => {
                    setUser(u);
                    setLoading(false);
                });
                return unsubscribe;
            }, []);

            useEffect(() => {
                if (!user) return;
                
                // Load Profile
                db.collection('users').doc(user.uid).collection('settings').doc('profile').get()
                    .then(doc => { if (doc.exists) setVaultName(doc.data().vaultName || 'PepVault'); });

                // Load Vials
                const unsubscribe = db.collection('users').doc(user.uid).collection('vials')
                    .orderBy('createdAt', 'desc')
                    .onSnapshot(snapshot => {
                        const data = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                        setVials(data);
                    }, error => {
                        console.error("Firestore Error:", error);
                    });
                return unsubscribe;
            }, [user]);

            const handleAuth = async (e) => {
                e.preventDefault();
                setAuthError('');
                setAuthSuccess('');
                try {
                    if (authMode === 'login') {
                        await auth.signInWithEmailAndPassword(email, password);
                    } else if (authMode === 'signup') {
                        await auth.createUserWithEmailAndPassword(email, password);
                    } else if (authMode === 'forgot') {
                        await auth.sendPasswordResetEmail(email);
                        setAuthSuccess('Password reset link sent! Please check your inbox.');
                    }
                } catch (err) {
                    setAuthError(err.message);
                }
            };

            const handleAddVial = async (e) => {
                e.preventDefault();
                await db.collection('users').doc(user.uid).collection('vials').add({
                    ...formData,
                    mg: parseFloat(formData.mg),
                    bac: parseFloat(formData.bac) || 0,
                    targetDose: parseFloat(formData.targetDose) || 250,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                setFormData({ name: '', mg: '', bac: '', expDate: '', targetDose: 250 });
                setActiveTab('inventory');
            };

            const startEditing = (vial) => {
                setEditingVialId(vial.id);
                setEditFormData({
                    name: vial.name,
                    mg: vial.mg,
                    bac: vial.bac,
                    expDate: vial.expDate || ''
                });
            };

            const handleSaveEdit = async (id) => {
                await db.collection('users').doc(user.uid).collection('vials').doc(id).update({
                    name: editFormData.name,
                    mg: parseFloat(editFormData.mg),
                    bac: parseFloat(editFormData.bac) || 0,
                    expDate: editFormData.expDate || null
                });
                setEditingVialId(null);
            };

            const updateVialDose = async (id, newDose) => {
                const doseValue = parseFloat(newDose) || 0;
                await db.collection('users').doc(user.uid).collection('vials').doc(id).update({
                    targetDose: doseValue
                });
            };

            const deleteVial = async (id) => {
                if(confirm("Are you sure you want to delete this vial?")) {
                    await db.collection('users').doc(user.uid).collection('vials').doc(id).delete();
                }
            };

            const saveVaultName = async () => {
                await db.collection('users').doc(user.uid).collection('settings').doc('profile').set({ vaultName }, { merge: true });
                setActiveTab('inventory');
            };

            if (loading) return (
                <div className="min-h-screen flex items-center justify-center">
                    <div className="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                </div>
            );

            if (!user) return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-slate-50">
                    <div className="w-full max-w-md bg-white p-8 rounded-[3rem] shadow-2xl border border-slate-100 space-y-8 animate-fade-in">
                        <div className="text-center space-y-2">
                            <div className="inline-flex bg-blue-600 p-4 rounded-[2rem] shadow-xl mb-4">
                                <Icon name="flask-conical" size={40} className="text-white" />
                            </div>
                            <h1 className="text-5xl font-bold text-slate-900 leading-none brand-font">PepVault</h1>
                        </div>
                        <form onSubmit={handleAuth} className="space-y-4">
                            <div className="space-y-1">
                                <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-2">Email Address</label>
                                <input 
                                    type="email" 
                                    name="email"
                                    id="email"
                                    autoComplete="username email"
                                    placeholder="name@example.com" 
                                    className="w-full p-4 bg-slate-50 rounded-2xl outline-none border-2 border-transparent focus:border-blue-500 font-bold" 
                                    value={email} 
                                    onChange={e => setEmail(e.target.value)} 
                                    required 
                                />
                            </div>
                            {authMode !== 'forgot' && (
                                <div className="space-y-1 animate-fade-in">
                                    <div className="flex justify-between items-center px-2">
                                        <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Password</label>
                                        {authMode === 'login' && (
                                            <button 
                                                type="button" 
                                                onClick={() => { setAuthMode('forgot'); setAuthError(''); setAuthSuccess(''); }}
                                                className="text-xs font-bold text-blue-600 hover:underline"
                                            >
                                                Forgot?
                                            </button>
                                        )}
                                    </div>
                                    <input 
                                        type="password" 
                                        name="password"
                                        id="password"
                                        autoComplete={authMode === 'login' ? 'current-password' : 'new-password'}
                                        placeholder="••••••••" 
                                        className="w-full p-4 bg-slate-50 rounded-2xl outline-none border-2 border-transparent focus:border-blue-500 font-bold" 
                                        value={password} 
                                        onChange={e => setPassword(e.target.value)} 
                                        required 
                                    />
                                </div>
                            )}
                            
                            {authError && <p className="text-red-500 text-xs font-bold px-2">{authError}</p>}
                            {authSuccess && <p className="text-emerald-600 text-xs font-bold px-2">{authSuccess}</p>}
                            
                            <button className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl shadow-lg uppercase tracking-widest text-xs active:scale-95 transition-transform">
                                {authMode === 'login' ? 'Open Vault' : authMode === 'signup' ? 'Create Vault' : 'Send Reset Link'}
                            </button>
                        </form>
                        <div className="flex flex-col items-center gap-2 pt-2">
                            {authMode === 'forgot' ? (
                                <button onClick={() => { setAuthMode('login'); setAuthError(''); setAuthSuccess(''); }} className="text-slate-400 font-bold text-[10px] uppercase tracking-widest">
                                    Back to Sign In
                                </button>
                            ) : (
                                <button onClick={() => { setAuthMode(authMode === 'login' ? 'signup' : 'login'); setAuthError(''); setAuthSuccess(''); }} className="text-slate-400 font-bold text-[10px] uppercase tracking-widest">
                                    {authMode === 'login' ? 'New? Create Account' : 'Have account? Sign In'}
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen pb-32 animate-fade-in">
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-20 px-6 py-5 flex justify-between items-center shadow-sm">
                        <div className="flex items-center gap-3">
                            <div className="bg-blue-600 p-2 rounded-xl shadow-lg shadow-blue-100"><Icon name="flask-conical" size={20} className="text-white" /></div>
                            <div>
                                <h1 className="text-2xl font-bold brand-font leading-none">{vaultName}</h1>
                                <p className="text-[9px] font-bold text-emerald-500 uppercase tracking-widest flex items-center gap-1">
                                    <span className="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span> Securely Logged In
                                </p>
                            </div>
                        </div>
                        <button onClick={() => setActiveTab('profile')} className="text-slate-400 p-2 bg-slate-50 rounded-xl"><Icon name="settings" size={20} /></button>
                    </header>

                    <main className="max-w-xl mx-auto p-4 md:p-6 space-y-6">
                        {activeTab === 'profile' ? (
                            <div className="bg-white p-8 rounded-[2.5rem] shadow-xl space-y-8 animate-fade-in">
                                <h2 className="text-2xl font-black uppercase tracking-tighter text-slate-800">Vault Settings</h2>
                                <div className="space-y-2">
                                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Vault Display Name</label>
                                    <div className="flex gap-2">
                                        <input type="text" className="flex-1 p-4 bg-slate-50 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-blue-500" value={vaultName} onChange={e => setVaultName(e.target.value)} />
                                        <button onClick={saveVaultName} className="bg-blue-600 text-white p-4 rounded-2xl shadow-lg active:scale-95 transition-transform"><Icon name="save" size={20} /></button>
                                    </div>
                                </div>
                                <div className="p-4 bg-slate-50 rounded-2xl space-y-1">
                                    <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Account Identity</p>
                                    <p className="text-xs font-mono text-slate-600 truncate">{user.uid}</p>
                                </div>
                                <button onClick={() => auth.signOut()} className="w-full py-4 bg-red-50 text-red-500 font-black rounded-2xl uppercase text-[10px] tracking-widest border border-red-100">Sign Out</button>
                                <button onClick={() => setActiveTab('inventory')} className="w-full text-slate-300 font-bold text-[10px] uppercase tracking-widest text-center">Back to Vault</button>
                            </div>
                        ) : activeTab === 'add' ? (
                            <form onSubmit={handleAddVial} className="bg-white p-8 rounded-[3rem] shadow-xl space-y-6 animate-fade-in">
                                <h2 className="text-2xl font-black uppercase tracking-tighter text-slate-800">New Entry</h2>
                                <div className="space-y-1">
                                    <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-2">Compound Name</label>
                                    <input type="text" placeholder="e.g. BPC-157" className="w-full p-4 bg-slate-50 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-blue-500" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} required />
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-2">Total MG</label>
                                        <input type="number" step="0.01" placeholder="5" className="w-full p-4 bg-slate-50 rounded-2xl font-bold outline-none" value={formData.mg} onChange={e => setFormData({...formData, mg: e.target.value})} required />
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-2">BAC Water (ml)</label>
                                        <input type="number" step="0.1" placeholder="2.0" className="w-full p-4 bg-slate-50 rounded-2xl font-bold outline-none" value={formData.bac} onChange={e => setFormData({...formData, bac: e.target.value})} />
                                    </div>
                                </div>
                                <div className="space-y-1">
                                    <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-2">Target Dose (mcg)</label>
                                    <input type="number" step="1" placeholder="250" className="w-full p-4 bg-slate-50 rounded-2xl font-bold outline-none" value={formData.targetDose} onChange={e => setFormData({...formData, targetDose: e.target.value})} />
                                </div>
                                <div className="space-y-1">
                                    <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-2">Recon / Exp Date</label>
                                    <input type="date" className="w-full p-4 bg-slate-50 rounded-2xl font-bold outline-none" value={formData.expDate} onChange={e => setFormData({...formData, expDate: e.target.value})} />
                                </div>
                                <button type="submit" className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase tracking-widest text-xs shadow-lg active:scale-95 transition-transform">Verify & Store</button>
                            </form>
                        ) : (
                            <div className="space-y-6">
                                {/* Search Header */}
                                <div className="relative group">
                                    <Icon name="search" size={20} className="absolute left-6 top-1/2 -translate-y-1/2 text-slate-300 group-focus-within:text-blue-500 transition-colors" />
                                    <input type="text" placeholder="Search Vault..." className="w-full pl-14 pr-8 py-5 bg-white border border-slate-200 rounded-[2.5rem] shadow-sm outline-none focus:ring-4 focus:ring-blue-50 font-bold transition-all" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                                </div>

                                {vials.filter(v => v.name.toLowerCase().includes(searchTerm.toLowerCase())).length === 0 ? (
                                    <div className="py-20 text-center space-y-4">
                                        <Icon name="package" size={48} className="mx-auto text-slate-200" />
                                        <p className="text-slate-400 font-bold uppercase tracking-widest text-[10px]">No research materials found</p>
                                    </div>
                                ) : (
                                    vials.filter(v => v.name.toLowerCase().includes(searchTerm.toLowerCase())).map(vial => {
                                        const isEditing = editingVialId === vial.id;
                                        
                                        // Calculations
                                        const totalMcg = vial.mg * 1000;
                                        const currentDose = vial.targetDose || 0;
                                        const daysRemaining = (currentDose > 0) ? Math.floor(totalMcg / currentDose) : 0;
                                        
                                        // Calculate exact end date safely (Without using a React Hook inside loop)
                                        const endDateStr = (() => {
                                            if (daysRemaining <= 0) return null;
                                            const today = new Date();
                                            today.setDate(today.getDate() + daysRemaining);
                                            return today.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
                                        })();

                                        const concentrationMgMl = vial.bac > 0 ? (vial.mg / vial.bac) : 0;
                                        const mcgPerUnit = concentrationMgMl * 10; 
                                        const unitsNeeded = (mcgPerUnit > 0 && currentDose > 0) ? (currentDose / mcgPerUnit).toFixed(1) : 0;

                                        return (
                                            <div key={vial.id} className="bg-white p-7 rounded-[2.5rem] border border-slate-100 shadow-sm space-y-4 animate-fade-in hover:shadow-md transition-shadow relative overflow-hidden group">
                                                
                                                {isEditing ? (
                                                    /* --- EDITING CARD VIEW --- */
                                                    <div className="space-y-4 animate-fade-in">
                                                        <div className="flex justify-between items-center pb-2 border-b border-slate-100">
                                                            <h4 className="text-xs font-black text-slate-400 uppercase tracking-widest">Modify Asset</h4>
                                                            <div className="flex gap-2">
                                                                <button onClick={() => handleSaveEdit(vial.id)} className="text-emerald-600 p-1.5 bg-emerald-50 rounded-lg hover:scale-105 transition-transform"><Icon name="save" size={16} /></button>
                                                                <button onClick={() => setEditingVialId(null)} className="text-slate-400 p-1.5 bg-slate-50 rounded-lg"><Icon name="x" size={16} /></button>
                                                            </div>
                                                        </div>
                                                        <div className="space-y-3">
                                                            <input type="text" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm text-slate-700" value={editFormData.name} onChange={e => setEditFormData({...editFormData, name: e.target.value})} placeholder="Name" />
                                                            <div className="grid grid-cols-2 gap-3">
                                                                <input type="number" step="0.01" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm text-slate-700" value={editFormData.mg} onChange={e => setEditFormData({...editFormData, mg: e.target.value})} placeholder="Total MG" />
                                                                <input type="number" step="0.1" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm text-slate-700" value={editFormData.bac} onChange={e => setEditFormData({...editFormData, bac: e.target.value})} placeholder="BAC ml" />
                                                            </div>
                                                            <input type="date" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm text-slate-700" value={editFormData.expDate} onChange={e => setEditFormData({...editFormData, expDate: e.target.value})} />
                                                        </div>
                                                    </div>
                                                ) : (
                                                    /* --- STANDARD CARD VIEW --- */
                                                    <>
                                                        <div className="flex justify-between items-start relative z-10">
                                                            <div>
                                                                <h3 className="text-2xl font-black uppercase tracking-tighter text-slate-800 leading-none group-hover:text-blue-600 transition-colors">{vial.name}</h3>
                                                                <div className="flex gap-2 mt-3">
                                                                    <span className="bg-blue-600 text-white px-3 py-1 rounded-lg text-[9px] font-black uppercase tracking-widest">{vial.mg}MG</span>
                                                                    {vial.bac > 0 && <span className="bg-emerald-50 text-emerald-700 px-3 py-1 rounded-lg text-[9px] font-black border border-emerald-100 uppercase tracking-widest">{concentrationMgMl.toFixed(2)} MG/ML</span>}
                                                                </div>
                                                            </div>
                                                            <div className="flex gap-1">
                                                                <button onClick={() => startEditing(vial)} className="text-slate-300 hover:text-blue-500 p-2 transition-colors"><Icon name="pencil" size={18} /></button>
                                                                <button onClick={() => deleteVial(vial.id)} className="text-slate-300 hover:text-red-500 p-2 transition-colors"><Icon name="trash-2" size={18} /></button>
                                                            </div>
                                                        </div>

                                                        {vial.bac > 0 ? (
                                                            <div className="space-y-3">
                                                                <div className="bg-slate-50 p-5 rounded-[1.5rem] border border-slate-100 shadow-inner space-y-4">
                                                                    <div className="flex items-center justify-between gap-4">
                                                                        <div className="flex items-center gap-2">
                                                                            <div className="bg-white p-1.5 rounded-lg shadow-sm">
                                                                                <Icon name="activity" size={14} className="text-blue-600" />
                                                                            </div>
                                                                            <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Desired Dose (mcg)</p>
                                                                        </div>
                                                                        <input 
                                                                            type="number"
                                                                            className="w-24 p-2 bg-white border border-slate-200 rounded-xl text-center font-black text-slate-800 outline-none focus:ring-2 focus:ring-blue-500 transition-all"
                                                                            value={vial.targetDose || 0}
                                                                            onChange={(e) => updateVialDose(vial.id, e.target.value)}
                                                                        />
                                                                    </div>

                                                                    <div className="flex items-center gap-4 text-xs font-bold text-slate-600 pt-3 border-t border-slate-200/50">
                                                                        <div className="bg-white p-2 rounded-xl shadow-sm">
                                                                            <Icon name="info" size={18} className="text-blue-500" />
                                                                        </div>
                                                                        <div className="flex-1 flex items-center justify-between">
                                                                            <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Syringe Draw</p>
                                                                            <p className="text-slate-800 font-black tracking-tight text-sm">
                                                                                <span className="text-emerald-600 bg-emerald-100 px-2 py-0.5 rounded-lg">{unitsNeeded} Units</span>
                                                                            </p>
                                                                        </div>
                                                                    </div>
                                                                </div>

                                                                {/* --- DURATION AND DEPLETION METRICS --- */}
                                                                {daysRemaining > 0 && (
                                                                    <div className="grid grid-cols-2 gap-3 px-2 text-xs">
                                                                        <div className="bg-slate-50/50 p-3 rounded-xl border border-slate-100 flex items-center gap-2">
                                                                            <Icon name="clock" size={14} className="text-slate-400" />
                                                                            <div>
                                                                                <p className="text-[9px] font-bold text-slate-400 uppercase tracking-wider">Supply Life</p>
                                                                                <p className="font-black text-slate-700">{daysRemaining} Injections</p>
                                                                            </div>
                                                                        </div>
                                                                        <div className="bg-slate-50/50 p-3 rounded-xl border border-slate-100 flex items-center gap-2">
                                                                            <Icon name="calendar" size={14} className="text-slate-400" />
                                                                            <div>
                                                                                <p className="text-[9px] font-bold text-slate-400 uppercase tracking-wider">Depletion Date</p>
                                                                                <p className="font-black text-slate-700">{endDateStr}</p>
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        ) : (
                                                            <div className="p-4 bg-amber-50 rounded-2xl flex items-center gap-3 text-[10px] font-bold text-amber-600 border border-amber-100">
                                                                <Icon name="alert-circle" size={14} /> Mix with BAC water to calculate metrics.
                                                            </div>
                                                        )}

                                                        <div className="flex justify-between text-[8px] font-bold text-slate-300 uppercase tracking-widest pt-2 border-t border-slate-50">
                                                            <span className="flex items-center gap-1"><Icon name="calendar" size={10} /> {vial.expDate || 'No date set'}</span>
                                                            <span>{vial.createdAt ? 'Synced' : 'Saving...'}</span>
                                                        </div>
                                                    </>
                                                )}
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-900/95 backdrop-blur-xl border border-white/10 px-10 py-5 flex gap-14 items-center z-20 rounded-[3rem] shadow-2xl">
                        <button onClick={() => setActiveTab('inventory')} className={`flex flex-col items-center gap-2 transition-all ${activeTab === 'inventory' ? 'text-blue-400 scale-110' : 'text-slate-500 hover:text-slate-400'}`}>
                            <Icon name="flask-conical" size={24} />
                            <span className="text-[8px] font-black uppercase tracking-[0.3em]">Vault</span>
                        </button>
                        <div className="w-px h-6 bg-white/10"></div>
                        <button onClick={() => setActiveTab('add')} className={`flex flex-col items-center gap-2 transition-all ${activeTab === 'add' ? 'text-blue-400 scale-110' : 'text-slate-500 hover:text-slate-400'}`}>
                            <Icon name="plus" size={28} />
                            <span className="text-[9px] font-black uppercase tracking-[0.3em]">Entry</span>
                        </button>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
