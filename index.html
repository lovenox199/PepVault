        // Calendar Dosing Simulator Helper
        const simulateDepletion = (totalMg, doseMcg, frequency, injectionStartDate) => {
            if (!doseMcg || doseMcg <= 0 || !totalMg || totalMg <= 0) {
                return { injections: 0, calendarDays: 0, daysUntilFinalDose: 0, dateStr: null };
            }

            const totalMcg = totalMg * 1000;
            const totalInjections = Math.floor(totalMcg / doseMcg);
            if (totalInjections <= 0) {
                return { injections: 0, calendarDays: 0, daysUntilFinalDose: 0, dateStr: null };
            }

            const finalDoseDate = injectionStartDate ? new Date(`${injectionStartDate}T00:00:00`) : new Date();
            finalDoseDate.setHours(0, 0, 0, 0);
            let injectionsGiven = 0;
            let daysUntilFinalDose = 0;
            let cycleDay = 0;

            // Counts the injection start date as the first possible dosing day. The displayed date is the FINAL dose date.
            // Example: 10 daily injections starting on Jun 10 = final dose on Jun 19, but 10 calendar days of supply.
            while (injectionsGiven < totalInjections && daysUntilFinalDose < 5000) {
                let isInjectionDay = false;

                switch (frequency) {
                    case 'daily':
                        isInjectionDay = true;
                        break;
                    case 'eod':
                        isInjectionDay = (cycleDay % 2 === 0);
                        break;
                    case '5-on-2-off':
                        isInjectionDay = (cycleDay % 7 < 5);
                        break;
                    case 'weekly':
                        isInjectionDay = (cycleDay % 7 === 0);
                        break;
                    case 'twice-weekly':
                        isInjectionDay = (cycleDay % 7 === 0 || cycleDay % 7 === 3);
                        break;
                    case 'three-times-weekly':
                        isInjectionDay = (cycleDay % 7 === 0 || cycleDay % 7 === 2 || cycleDay % 7 === 4);
                        break;
                    default:
                        isInjectionDay = true;
                }

                if (isInjectionDay) {
                    injectionsGiven++;
                    if (injectionsGiven === totalInjections) break;
                }

                finalDoseDate.setDate(finalDoseDate.getDate() + 1);
                daysUntilFinalDose++;
                cycleDay++;
            }

            const dateStr = finalDoseDate.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
            return {
                injections: totalInjections,
                calendarDays: daysUntilFinalDose + 1,
                daysUntilFinalDose,
                dateStr
            };
        };

        const getTodayInputDate = () => {

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, message: '' };
            }

            static getDerivedStateFromError(error) {
                return { hasError: true, message: error?.message || 'Unknown rendering error' };
            }

            componentDidCatch(error, info) {
                console.error('PepVault render error:', error, info);
            }

            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex items-center justify-center p-6 bg-slate-50">
                            <div className="max-w-md w-full bg-white rounded-[2rem] shadow-xl border border-red-100 p-6 space-y-3">

                                </div>

                                <p className="text-sm font-bold text-slate-500 leading-relaxed">
                                    A saved database entry probably has missing or unexpected data. Open the browser console for details, or fix/delete the older Firestore entry.
                                </p>
                                <pre className="bg-slate-900 text-white text-xs rounded-2xl p-4 overflow-auto whitespace-pre-wrap">{this.state.message}</pre>

                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        function App() {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [vials, setVials] = useState([]);
            const [savedSetups, setSavedSetups] = useState([]);
            const [activeTab, setActiveTab] = useState('inventory');
            const [authMode, setAuthMode] = useState('login'); // 'login' | 'signup' | 'forgot'
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [authError, setAuthError] = useState('');
            const [authSuccess, setAuthSuccess] = useState('');
            const [vaultName, setVaultName] = useState('PepVault');
            const [searchTerm, setSearchTerm] = useState('');
            const suggestionScrollerRef = useRef(null);
            const suggestionDragRef = useRef({ isDown: false, startX: 0, scrollLeft: 0, hasMoved: false });
            
            // Edit Mode State
            const [editingVialId, setEditingVialId] = useState(null);
            const [editFormData, setEditFormData] = useState({ name: '', mg: '', bac: '', expDate: '', injectionStartDate: getTodayInputDate(), frequency: 'daily' });

            const [formData, setFormData] = useState({ name: '', mg: '', bac: '', expDate: '', injectionStartDate: getTodayInputDate(), targetDose: 250, frequency: 'daily' });

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((u) => {
                    setUser(u);
                    setLoading(false);
                });
                return unsubscribe;
            }, []);

            useEffect(() => {
                if (!user) return;
                
                // Load Profile
                db.collection('users').doc(user.uid).collection('settings').doc('profile').get()
                    .then(doc => { if (doc.exists) setVaultName(doc.data().vaultName || 'PepVault'); });

                // Load Vials
                const unsubscribeVials = db.collection('users').doc(user.uid).collection('vials')
                    .orderBy('createdAt', 'desc')
                    .onSnapshot(snapshot => {
                        const data = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                        setVials(data);
                    }, error => {
                        console.error("Firestore Vials Error:", error);
                    });

                // Load User-Saved Setups
                const unsubscribeSetups = db.collection('users').doc(user.uid).collection('savedSetups')
                    .orderBy('createdAt', 'desc')
                    .onSnapshot(snapshot => {
                        const data = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                        setSavedSetups(data);
                    }, error => {
                        console.error("Firestore Setups Error:", error);
                    });

                return () => {
                    unsubscribeVials();
                    unsubscribeSetups();
                };
            }, [user]);

            const handleAuth = async (e) => {
                e.preventDefault();
                setAuthError('');
                setAuthSuccess('');
                try {
                    if (authMode === 'login') {
                        await auth.signInWithEmailAndPassword(email, password);
                    } else if (authMode === 'signup') {
                        await auth.createUserWithEmailAndPassword(email, password);
                    } else if (authMode === 'forgot') {
                        await auth.sendPasswordResetEmail(email);
                        setAuthSuccess('Password reset link sent! Please check your inbox.');
                    }
                } catch (err) {
                    setAuthError(err.message);
                }
            };

                    mg: parseFloat(formData.mg),
                    bac: parseFloat(formData.bac) || 0,
                    targetDose: parseFloat(formData.targetDose) || 250,
                    frequency: formData.frequency || 'daily',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                setFormData({ name: '', mg: '', bac: '', expDate: '', injectionStartDate: getTodayInputDate(), targetDose: 250, frequency: 'daily' });
                setActiveTab('inventory');
            };

            const allSavedSetups = [...BUILT_IN_SAVED_SETUPS, ...savedSetups];

            const applySavedSetup = (setup) => {
                setFormData({
                    ...formData,
                    name: setup.name || '',
                    mg: setup.mg ?? '',
                    bac: setup.bac ?? '',
                    targetDose: setup.targetDose ?? 250,
                    frequency: setup.frequency || 'daily',
                    injectionStartDate: getTodayInputDate()
                });
            };

            const saveVialAsSetup = async (vial) => {
                const presetName = prompt('Name this saved setup:', vial.name ? `${vial.name} setup` : 'Saved setup');

                await db.collection('users').doc(user.uid).collection('savedSetups').add({

                    targetDose: parseFloat(vial.targetDose) || 0,
                    frequency: vial.frequency || 'daily',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()

            };

            const saveCurrentFormAsSetup = async () => {

                    bac: parseFloat(formData.bac) || 0,
                    targetDose: parseFloat(formData.targetDose) || 0,
                    frequency: formData.frequency || 'daily',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()

            const deleteSavedSetup = async (setup) => {
                if (setup.isBuiltIn) return;
                if (confirm(`Delete saved setup "${setup.presetName}"?`)) {
                    await db.collection('users').doc(user.uid).collection('savedSetups').doc(setup.id).delete();
                }
            };


            const startSuggestionDrag = (e) => {
                const scroller = suggestionScrollerRef.current;
                if (!scroller) return;

                suggestionDragRef.current = {
                    isDown: true,
                    startX: e.clientX,
                    scrollLeft: scroller.scrollLeft,
                    hasMoved: false
                };

                scroller.classList.add('dragging');
                if (e.pointerId !== undefined && scroller.setPointerCapture) {
                    scroller.setPointerCapture(e.pointerId);
                }
            };

            const moveSuggestionDrag = (e) => {
                const scroller = suggestionScrollerRef.current;
                const drag = suggestionDragRef.current;
                if (!scroller || !drag.isDown) return;

                const walk = e.clientX - drag.startX;
                if (Math.abs(walk) > 4) {
                    drag.hasMoved = true;
                    e.preventDefault();
                }

                scroller.scrollLeft = drag.scrollLeft - walk;
            };

            const stopSuggestionDrag = (e) => {
                const scroller = suggestionScrollerRef.current;
                if (scroller) {
                    scroller.classList.remove('dragging');
                    if (e?.pointerId !== undefined && scroller.releasePointerCapture) {
                        try { scroller.releasePointerCapture(e.pointerId); } catch (_) {}
                    }
                }
                suggestionDragRef.current.isDown = false;
            };

            const chooseSuggestion = (e, name) => {
                if (suggestionDragRef.current.hasMoved) {
                    e.preventDefault();
                    e.stopPropagation();
                    setTimeout(() => {

            if (loading) return (

                </div>

                                    <div className="flex gap-2">
                                        <input type="text" className="flex-1 p-4 bg-slate-50 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-blue-500" value={vaultName} onChange={e => setVaultName(e.target.value)} />
                                        <button onClick={saveVaultName} className="bg-blue-600 text-white p-4 rounded-2xl shadow-lg active:scale-95 transition-transform"><Icon name="save" size={20} /></button>
                                    </div>
                                </div>
                                <div className="p-4 bg-slate-50 rounded-2xl space-y-1">
                                    <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Account Identity</p>
                                    <p className="text-xs font-mono text-slate-600 truncate">{user.uid}</p>
                                </div>
                                <button onClick={() => auth.signOut()} className="w-full py-4 bg-red-50 text-red-500 font-black rounded-2xl uppercase text-[10px] tracking-widest border border-red-100">Sign Out</button>
                                <button onClick={() => setActiveTab('inventory')} className="w-full text-slate-300 font-bold text-[10px] uppercase tracking-widest text-center">Back to Vault</button>
                            </div>
                        ) : activeTab === 'add' ? (
                            <form onSubmit={handleAddVial} className="bg-white p-8 rounded-[3rem] shadow-xl space-y-6 animate-fade-in">
                                <h2 className="text-2xl font-black uppercase tracking-tighter text-slate-800">New Entry</h2>

                                <div className="bg-slate-50 border border-slate-100 rounded-[2rem] p-4 space-y-3">
                                    <div className="flex items-center justify-between">
                                        <div className="flex items-center gap-2">
                                            <div className="bg-white p-1.5 rounded-lg shadow-sm"><Icon name="star" size={14} className="text-blue-600" /></div>
                                            <p className="text-[10px] font-black text-slate-500 uppercase tracking-widest">Saved Setups</p>
                                        </div>
                                        <button type="button" onClick={saveCurrentFormAsSetup} className="text-[9px] font-black text-blue-600 uppercase tracking-widest bg-white px-3 py-2 rounded-xl border border-blue-100 active:scale-95 transition-transform">Save Current</button>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-72 overflow-y-auto pr-1 pb-1 overscroll-contain">
                                        {allSavedSetups.map(setup => (
                                            <div key={setup.id} className="bg-white border border-slate-100 rounded-2xl p-3 shadow-sm">
                                                <button
                                                    type="button"
                                                    onClick={() => applySavedSetup(setup)}
                                                    className="w-full text-left active:scale-95 transition-transform"
                                                >
                                                    <p className="text-[10px] font-black text-slate-800 uppercase tracking-wider leading-tight">{setup.presetName}</p>
                                                    <p className="text-[9px] font-bold text-slate-400 mt-1 line-clamp-2">{setup.name}</p>
                                                    <div className="flex flex-wrap gap-1 mt-2">
                                                        <span className="bg-blue-50 text-blue-700 px-2 py-1 rounded-lg text-[8px] font-black">{setup.mg}mg</span>
                                                        <span className="bg-emerald-50 text-emerald-700 px-2 py-1 rounded-lg text-[8px] font-black">{setup.bac}mL</span>
                                                        <span className="bg-slate-100 text-slate-600 px-2 py-1 rounded-lg text-[8px] font-black">{setup.targetDose}mcg</span>
                                                    </div>
                                                </button>
                                                {!setup.isBuiltIn && (
                                                    <button type="button" onClick={() => deleteSavedSetup(setup)} className="mt-2 text-[8px] font-black text-red-400 uppercase tracking-widest">Delete</button>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                    <p className="text-[9px] text-slate-400 font-bold leading-relaxed px-1">Scroll this list vertically. Setups fill saved name, vial amount, BAC water, target dose, and frequency. Verify each entry before saving.</p>
                                </div>

                                <div className="space-y-1">
                                    <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-2">Compound Name</label>
                                    <input 
                                        type="text" 
                                        list="peptide-name-suggestions"
                                        placeholder="Start typing peptide name..." 
                                        className="w-full p-4 bg-slate-50 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-blue-500" 
                                        value={formData.name} 
                                        onChange={e => setFormData({...formData, name: e.target.value})} 
                                        required 
                                    />
                                    <datalist id="peptide-name-suggestions">
                                        {PEPTIDE_NAME_SUGGESTIONS.map(name => <option key={name} value={name} />)}
                                    </datalist>
                                    <div className="mt-3 space-y-2">
                                        <div className="flex items-center justify-between px-1">
                                            <p className="text-[9px] font-black text-slate-400 uppercase tracking-widest">Suggestions</p>
                                            <p className="text-[9px] font-bold text-slate-300 uppercase tracking-widest">Name only</p>
                                        </div>
                                        <div 
                                            ref={suggestionScrollerRef}
                                            onPointerDown={startSuggestionDrag}
                                            onPointerMove={moveSuggestionDrag}
                                            onPointerUp={stopSuggestionDrag}
                                            onPointerCancel={stopSuggestionDrag}
                                            onPointerLeave={stopSuggestionDrag}
                                            className="drag-scroll flex gap-2 overflow-x-auto pb-2 cursor-grab overscroll-x-contain"
                                        >
                                            {PEPTIDE_NAME_SUGGESTIONS
                                                .filter(name => !formData.name || name.toLowerCase().includes(formData.name.toLowerCase()))
                                                .map(name => (
                                                    <button 
                                                        type="button" 
                                                        key={name}
                                                        onClick={(e) => chooseSuggestion(e, name)}
                                                        className="shrink-0 px-3 py-2 bg-blue-50 text-blue-700 border border-blue-100 rounded-xl text-[10px] font-black uppercase tracking-wider active:scale-95 transition-transform"
                                                    >
                                                        {name}
                                                    </button>
                                                ))}
                                        </div>
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-2">Total MG</label>
                                        <input type="number" step="0.01" placeholder="5" className="w-full p-4 bg-slate-50 rounded-2xl font-bold outline-none" value={formData.mg} onChange={e => setFormData({...formData, mg: e.target.value})} required />
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-2">BAC Water (ml)</label>
                                        <input type="number" step="0.1" placeholder="2.0" className="w-full p-4 bg-slate-50 rounded-2xl font-bold outline-none" value={formData.bac} onChange={e => setFormData({...formData, bac: e.target.value})} />
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-2">Target Dose (mcg)</label>
                                        <input type="number" step="1" placeholder="250" className="w-full p-4 bg-slate-50 rounded-2xl font-bold outline-none" value={formData.targetDose} onChange={e => setFormData({...formData, targetDose: e.target.value})} />
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-2">Dosing Frequency</label>
                                        <select className="w-full p-4 bg-slate-50 rounded-2xl font-bold outline-none" value={formData.frequency} onChange={e => setFormData({...formData, frequency: e.target.value})}>
                                            <option value="daily">Daily</option>
                                            <option value="eod">Every Other Day</option>
                                            <option value="5-on-2-off">5 Days On / 2 Off</option>
                                            <option value="weekly">Once Weekly</option>
                                            <option value="twice-weekly">Twice Weekly</option>
                                            <option value="three-times-weekly">3x Weekly</option>
                                        </select>
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-2">Injection Start Date</label>
                                        <input type="date" className="w-full p-4 bg-slate-50 rounded-2xl font-bold outline-none" value={formData.injectionStartDate} onChange={e => setFormData({...formData, injectionStartDate: e.target.value})} />
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-2">Expiration Date</label>
                                        <input type="date" className="w-full p-4 bg-slate-50 rounded-2xl font-bold outline-none" value={formData.expDate} onChange={e => setFormData({...formData, expDate: e.target.value})} />
                                    </div>
                                </div>
                                <button type="submit" className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase tracking-widest text-xs shadow-lg active:scale-95 transition-transform">Calculate & Save</button>
                            </form>
                        ) : (
                            <div className="space-y-6">
                                {/* Search Header */}
                                <div className="relative group">
                                    <Icon name="search" size={20} className="absolute left-6 top-1/2 -translate-y-1/2 text-slate-300 group-focus-within:text-blue-500 transition-colors" />
                                    <input type="text" placeholder="Search Vault..." className="w-full pl-14 pr-8 py-5 bg-white border border-slate-200 rounded-[2.5rem] shadow-sm outline-none focus:ring-4 focus:ring-blue-50 font-bold transition-all" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                                </div>

                                {vials.filter(v => (v.name || '').toLowerCase().includes(searchTerm.toLowerCase())).length === 0 ? (
                                    <div className="py-20 text-center space-y-4">
                                        <Icon name="package" size={48} className="mx-auto text-slate-200" />
                                        <p className="text-slate-400 font-bold uppercase tracking-widest text-[10px]">No research materials found</p>
                                    </div>
                                ) : (
                                    vials.filter(v => (v.name || '').toLowerCase().includes(searchTerm.toLowerCase())).map(vial => {
                                        const isEditing = editingVialId === vial.id;
                                        
                                        // Dynamic Calendar Simulation (Safe from inside loop)
                                        const scheduleMetrics = simulateDepletion(parseFloat(vial.mg) || 0, parseFloat(vial.targetDose) || 0, vial.frequency || 'daily', vial.injectionStartDate);

                                        const vialMg = parseFloat(vial.mg) || 0;
                                        const vialBac = parseFloat(vial.bac) || 0;
                                        const vialTargetDose = parseFloat(vial.targetDose) || 0;
                                        const concentrationMgMl = vialBac > 0 ? (vialMg / vialBac) : 0;
                                        const mcgPerUnit = concentrationMgMl * 10; 
                                        const unitsNeeded = (mcgPerUnit > 0 && vialTargetDose > 0) ? (vialTargetDose / mcgPerUnit).toFixed(1) : 0;

                                        return (
                                            <div key={vial.id} className="bg-white p-7 rounded-[2.5rem] border border-slate-100 shadow-sm space-y-4 animate-fade-in hover:shadow-md transition-shadow relative overflow-hidden group">
                                                
                                                {isEditing ? (
                                                    /* --- EDITING CARD VIEW --- */
                                                    <div className="space-y-4 animate-fade-in">
                                                        <div className="flex justify-between items-center pb-2 border-b border-slate-100">
                                                            <h4 className="text-xs font-black text-slate-400 uppercase tracking-widest">Modify Asset</h4>
                                                            <div className="flex gap-2">
                                                                <button onClick={() => handleSaveEdit(vial.id)} className="text-emerald-600 p-1.5 bg-emerald-50 rounded-lg hover:scale-105 transition-transform"><Icon name="save" size={16} /></button>
                                                                <button onClick={() => setEditingVialId(null)} className="text-slate-400 p-1.5 bg-slate-50 rounded-lg"><Icon name="x" size={16} /></button>
                                                            </div>
                                                        </div>
                                                        <div className="space-y-3">
                                                            <div className="space-y-1">
                                                                <label className="text-[9px] font-black text-slate-400 uppercase tracking-wider ml-1">Compound Name</label>
                                                                <input 
                                                                    type="text" 
                                                                    list="peptide-name-suggestions"
                                                                    className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm text-slate-700" 
                                                                    value={editFormData.name} 
                                                                    onChange={e => setEditFormData({...editFormData, name: e.target.value})} 
                                                                    placeholder="Name" 
                                                                />
                                                            </div>
                                                            <div className="grid grid-cols-2 gap-3">
                                                                <div className="space-y-1">
                                                                    <label className="text-[9px] font-black text-slate-400 uppercase tracking-wider ml-1">Total MG</label>
                                                                    <input type="number" step="0.01" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm text-slate-700" value={editFormData.mg} onChange={e => setEditFormData({...editFormData, mg: e.target.value})} placeholder="Total MG" />
                                                                </div>
                                                                <div className="space-y-1">
                                                                    <label className="text-[9px] font-black text-slate-400 uppercase tracking-wider ml-1">BAC Water (ml)</label>
                                                                    <input type="number" step="0.1" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm text-slate-700" value={editFormData.bac} onChange={e => setEditFormData({...editFormData, bac: e.target.value})} placeholder="BAC ml" />
                                                                </div>
                                                            </div>
                                                            <div className="grid grid-cols-2 gap-3">
                                                                <div className="space-y-1">
                                                                    <label className="text-[9px] font-black text-slate-400 uppercase tracking-wider ml-1">Frequency</label>
                                                                    <select className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm text-slate-700" value={editFormData.frequency} onChange={e => setEditFormData({...editFormData, frequency: e.target.value})}>
                                                                        <option value="daily">Daily</option>
                                                                        <option value="eod">Every Other Day</option>
                                                                        <option value="5-on-2-off">5 Days On / 2 Off</option>
                                                                        <option value="weekly">Once Weekly</option>
                                                                        <option value="twice-weekly">Twice Weekly</option>
                                                                        <option value="three-times-weekly">3x Weekly</option>
                                                                    </select>
                                                                </div>
                                                                <div className="space-y-1">
                                                                    <label className="text-[9px] font-black text-slate-400 uppercase tracking-wider ml-1">Start Date</label>
                                                                    <input type="date" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm text-slate-700" value={editFormData.injectionStartDate} onChange={e => setEditFormData({...editFormData, injectionStartDate: e.target.value})} />
                                                                </div>
                                                            </div>
                                                            <div className="space-y-1">
                                                                <label className="text-[9px] font-black text-slate-400 uppercase tracking-wider ml-1">Expiration Date</label>
                                                                <input type="date" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm text-slate-700" value={editFormData.expDate} onChange={e => setEditFormData({...editFormData, expDate: e.target.value})} />
                                                            </div>
                                                        </div>
                                                    </div>
                                                ) : (
                                                    /* --- STANDARD CARD VIEW --- */
                                                    <>
                                                        <div className="flex justify-between items-start relative z-10">
                                                            <div>
                                                                <h3 className="text-2xl font-black uppercase tracking-tighter text-slate-800 leading-none group-hover:text-blue-600 transition-colors">{vial.name || 'Unnamed Vial'}</h3>
                                                                <div className="flex flex-wrap gap-2 mt-3">
                                                                    <span className="bg-blue-600 text-white px-3 py-1 rounded-lg text-[9px] font-black uppercase tracking-widest">{vialMg}MG</span>
                                                                    {vialBac > 0 && <span className="bg-emerald-50 text-emerald-700 px-3 py-1 rounded-lg text-[9px] font-black border border-emerald-100 uppercase tracking-widest">{concentrationMgMl.toFixed(2)} MG/ML</span>}
                                                                    <span className="bg-slate-100 text-slate-600 px-3 py-1 rounded-lg text-[9px] font-black border border-slate-200 uppercase tracking-widest">{getFrequencyLabel(vial.frequency)}</span>
                                                                </div>
                                                            </div>
                                                            <div className="flex gap-1">
                                                                <button onClick={() => saveVialAsSetup(vial)} title="Save as setup" className="text-slate-300 hover:text-amber-500 p-2 transition-colors"><Icon name="star" size={18} /></button>
                                                                <button onClick={() => startEditing(vial)} className="text-slate-300 hover:text-blue-500 p-2 transition-colors"><Icon name="pencil" size={18} /></button>
                                                                <button onClick={() => deleteVial(vial.id)} className="text-slate-300 hover:text-red-500 p-2 transition-colors"><Icon name="trash-2" size={18} /></button>
                                                            </div>
                                                        </div>

                                                        {vial.bac > 0 ? (
                                                            <div className="space-y-3">
                                                                <div className="bg-slate-50 p-5 rounded-[1.5rem] border border-slate-100 shadow-inner space-y-4">
                                                                    <div className="flex items-center justify-between gap-4">
                                                                        <div className="flex items-center gap-2">
                                                                            <div className="bg-white p-1.5 rounded-lg shadow-sm">
                                                                                <Icon name="activity" size={14} className="text-blue-600" />
                                                                            </div>
                                                                            <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Desired Dose (mcg)</p>
                                                                        </div>
                                                                        <input 
                                                                            type="number"
                                                                            className="w-24 p-2 bg-white border border-slate-200 rounded-xl text-center font-black text-slate-800 outline-none focus:ring-2 focus:ring-blue-500 transition-all"
                                                                            value={vialTargetDose}
                                                                            onChange={(e) => updateVialDose(vial.id, e.target.value)}
                                                                        />
                                                                    </div>

                                                                    <div className="flex items-center gap-4 text-xs font-bold text-slate-600 pt-3 border-t border-slate-200/50">
                                                                        <div className="bg-white p-2 rounded-xl shadow-sm">
                                                                            <Icon name="info" size={18} className="text-blue-500" />
                                                                        </div>
                                                                        <div className="flex-1 flex items-center justify-between">
                                                                            <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Syringe Draw</p>
                                                                            <p className="text-slate-800 font-black tracking-tight text-sm">
                                                                                <span className="text-emerald-600 bg-emerald-100 px-2 py-0.5 rounded-lg">{unitsNeeded} Units</span>
                                                                            </p>
                                                                        </div>
                                                                    </div>

                                                                    <details className="pt-3 border-t border-slate-200/50 group/formula">
                                                                        <summary className="flex items-center justify-between cursor-pointer list-none">
                                                                            <div className="flex items-center gap-2">
                                                                                <div className="bg-white p-1.5 rounded-lg shadow-sm">
                                                                                    <Icon name="calculator" size={14} className="text-slate-500" />
                                                                                </div>
                                                                                <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">How this is calculated</p>
                                                                            </div>
                                                                            <Icon name="chevron-down" size={14} className="text-slate-300 transition-transform group-open/formula:rotate-180" />
                                                                        </summary>
                                                                        <div className="mt-3 bg-white rounded-2xl p-4 border border-slate-100 space-y-2 text-[10px] font-bold text-slate-500 leading-relaxed">
                                                                            <p><span className="text-slate-800 font-black">Concentration:</span> {vialMg} mg ÷ {vialBac} mL = {concentrationMgMl.toFixed(2)} mg/mL</p>
                                                                            <p><span className="text-slate-800 font-black">mcg per insulin unit:</span> {concentrationMgMl.toFixed(2)} × 10 = {mcgPerUnit.toFixed(1)} mcg/unit</p>
                                                                            <p><span className="text-slate-800 font-black">Syringe draw:</span> {vialTargetDose} mcg ÷ {mcgPerUnit.toFixed(1)} = {unitsNeeded} units</p>
                                                                        </div>
                                                                    </details>
                                                                </div>

                                                                {/* --- DURATION AND DEPLETION METRICS --- */}
                                                                {scheduleMetrics.injections > 0 && (
                                                                    <div className="grid grid-cols-2 gap-3 px-2 text-xs">
                                                                        <div className="bg-slate-50/50 p-3 rounded-xl border border-slate-100 flex items-center gap-2">
                                                                            <Icon name="clock" size={14} className="text-slate-400" />
                                                                            <div>
                                                                                <p className="text-[9px] font-bold text-slate-400 uppercase tracking-wider">Supply Life</p>
                                                                                <p className="font-black text-slate-700 leading-tight">{scheduleMetrics.injections} Injections</p>
                                                                                <p className="text-[9px] text-slate-400 font-bold uppercase tracking-tighter mt-0.5">({scheduleMetrics.calendarDays} calendar days)</p>
                                                                            </div>
                                                                        </div>
                                                                        <div className="bg-slate-50/50 p-3 rounded-xl border border-slate-100 flex items-center gap-2">
                                                                            <Icon name="calendar" size={14} className="text-slate-400" />
                                                                            <div>
                                                                                <p className="text-[9px] font-bold text-slate-400 uppercase tracking-wider">Final Dose Date</p>
                                                                                <p className="font-black text-slate-700 leading-tight">{scheduleMetrics.dateStr}</p>
                                                                                <p className="text-[9px] text-slate-400 font-bold uppercase tracking-tighter mt-0.5">From Start Date</p>
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        ) : (
                                                            <div className="p-4 bg-amber-50 rounded-2xl flex items-center gap-3 text-[10px] font-bold text-amber-600 border border-amber-100">
                                                                <Icon name="alert-circle" size={14} /> Mix with BAC water to calculate metrics.
                                                            </div>
                                                        )}

                                                        <div className="flex flex-wrap justify-between gap-2 text-[8px] font-bold text-slate-300 uppercase tracking-widest pt-2 border-t border-slate-50">
                                                            <span className="flex items-center gap-1"><Icon name="calendar" size={10} /> Start: {vial.injectionStartDate || 'Today'}</span>
                                                            <span>{vial.createdAt ? 'Synced' : 'Saving...'}</span>
                                                        </div>
                                                    </>
                                                )}
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-900/90 backdrop-blur-xl border border-white/10 px-10 py-5 flex gap-14 items-center z-20 rounded-[3rem] shadow-2xl">
                        <button onClick={() => setActiveTab('inventory')} className={`flex flex-col items-center gap-2 transition-all ${activeTab === 'inventory' ? 'text-blue-400 scale-110' : 'text-slate-500 hover:text-slate-400'}`}>
                            <Icon name="flask-conical" size={24} />
                            <span className="text-[8px] font-black uppercase tracking-[0.3em]">Vault</span>
                        </button>
                        <div className="w-px h-6 bg-white/10"></div>
                        <button onClick={() => setActiveTab('add')} className={`flex flex-col items-center gap-2 transition-all ${activeTab === 'add' ? 'text-blue-400 scale-110' : 'text-slate-500 hover:text-slate-400'}`}>
                            <Icon name="plus" size={28} />
                            <span className="text-[9px] font-black uppercase tracking-[0.3em]">Entry</span>
                        </button>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
